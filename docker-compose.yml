services:
  db:
    image: pgvector/pgvector:pg18
    container_name: api-tickets-postgres-1
    environment:
      POSTGRES_USER: api_tickets
      POSTGRES_PASSWORD: api_tickets
      POSTGRES_DB: api_tickets
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    container_name: api-tickets-redis-1
    ports:
      - '6379:6379'

volumes:
  postgres_data:

